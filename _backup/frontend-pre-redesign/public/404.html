<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
      // SPA routing fallback for GitHub Pages (which has no server-side rewrites).
      // Based on https://github.com/rafgraph/spa-github-pages (MIT License).
      // Set to 1 if deployed at <user>.github.io/<repo-name>/ (the default for
      // a project site), or 0 if deployed at a custom domain / the root of
      // <user>.github.io. Not needed at all when deploying to Vercel.
      var pathSegmentsToKeep = 1

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
